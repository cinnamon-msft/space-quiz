<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Cosmic Quest</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f3f0ff;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-strong: #ffffff;
      --text: #211b3a;
      --muted: #6d6685;
      --border: #ded8f0;
      --purple: #7047eb;
      --purple-dark: #5530c4;
      --purple-soft: #eee8ff;
      --green: #147d4a;
      --green-soft: #ddf7e9;
      --red: #bc3346;
      --red-soft: #ffe3e6;
      --shadow: 0 24px 64px rgba(61, 42, 110, 0.15);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --background: #100d1c;
        --surface: rgba(29, 24, 48, 0.92);
        --surface-strong: #27203e;
        --text: #f5f1ff;
        --muted: #bcb4d3;
        --border: #443a61;
        --purple: #a78bfa;
        --purple-dark: #c4b5fd;
        --purple-soft: #392d5b;
        --green: #64d79d;
        --green-soft: #163f30;
        --red: #ff8291;
        --red-soft: #51222b;
        --shadow: 0 24px 72px rgba(0, 0, 0, 0.38);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% 15%, rgba(112, 71, 235, 0.16), transparent 28%),
        radial-gradient(circle at 90% 85%, rgba(42, 190, 129, 0.12), transparent 30%),
        var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    body::before,
    body::after {
      position: fixed;
      z-index: 0;
      color: var(--purple);
      opacity: 0.22;
      content: "✦";
      pointer-events: none;
      animation: twinkle 3s ease-in-out infinite;
    }

    body::before {
      top: 10%;
      left: 10%;
      font-size: 28px;
    }

    body::after {
      right: 12%;
      bottom: 13%;
      font-size: 20px;
      animation-delay: -1.2s;
    }

    .star-field {
      position: fixed;
      inset: -40px;
      z-index: 0;
      pointer-events: none;
      opacity: 0.38;
      background-image:
        radial-gradient(circle, color-mix(in srgb, var(--text) 55%, transparent) 0 1px, transparent 1.4px),
        radial-gradient(circle, var(--purple) 0 1px, transparent 1.5px),
        radial-gradient(circle, color-mix(in srgb, var(--green) 65%, transparent) 0 0.8px, transparent 1.3px);
      background-position: 0 0, 28px 34px, 12px 70px;
      background-size: 86px 86px, 121px 121px, 157px 157px;
      animation: star-drift 36s linear infinite;
    }

    .quiz-shell {
      position: relative;
      z-index: 1;
      width: min(100%, 520px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 10px 30px rgba(61, 42, 110, 0.1);
      font-size: 14px;
      font-weight: 800;
      backdrop-filter: blur(14px);
    }

    .brand-identity,
    .mission-status {
      display: flex;
      align-items: center;
    }

    .brand-identity {
      gap: 10px;
      min-width: 0;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 12px;
      background: var(--purple);
      color: white;
      font-size: 19px;
      box-shadow: 0 8px 20px rgba(112, 71, 235, 0.3);
    }

    .mission-status {
      flex: 0 0 auto;
      gap: 7px;
      padding: 6px 9px;
      border: 1px solid color-mix(in srgb, var(--green) 35%, var(--border));
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 11px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .status-light {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 18%, transparent);
      animation: status-pulse 2s ease-in-out infinite;
    }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 24px 26px 17px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .score {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
    }

    .score strong {
      color: var(--purple-dark);
      font-size: 17px;
    }

    .progress-track {
      height: 7px;
      margin: 0 26px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--purple-soft);
    }

    .progress-bar {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--purple), #b14cf0);
      transition: width 400ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .content {
      padding: 30px 26px 28px;
    }

    .question-tag {
      margin: 0 0 8px;
      color: var(--purple-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      min-height: 72px;
      margin: 0 0 24px;
      font-size: clamp(22px, 5vw, 28px);
      line-height: 1.3;
      letter-spacing: -0.025em;
    }

    .answers {
      display: grid;
      gap: 11px;
    }

    .answer {
      width: 100%;
      min-height: 52px;
      padding: 13px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface-strong);
      color: var(--text);
      font: inherit;
      font-weight: 650;
      text-align: left;
      cursor: pointer;
      transition: border-color 160ms ease, transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--purple);
      box-shadow: 0 8px 20px rgba(112, 71, 235, 0.12);
    }

    .answer:focus-visible,
    .restart:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--purple) 40%, transparent);
      outline-offset: 3px;
    }

    .answer:disabled {
      cursor: default;
    }

    .answer.correct {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green);
      animation: correct-pop 500ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .answer.wrong {
      border-color: var(--red);
      background: var(--red-soft);
      color: var(--red);
      animation: shake 430ms ease;
    }

    .answer.reveal {
      border-color: var(--green);
      color: var(--green);
    }

    .feedback {
      min-height: 25px;
      margin: 18px 0 0;
      font-weight: 750;
      text-align: center;
    }

    .feedback.correct {
      color: var(--green);
      animation: float-in 350ms ease both;
    }

    .feedback.wrong {
      color: var(--red);
      animation: float-in 350ms ease both;
    }

    .question-stage.enter {
      animation: slide-in 360ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .results {
      display: none;
      padding: 46px 30px 38px;
      text-align: center;
    }

    .results.visible {
      display: block;
      animation: float-in 500ms ease both;
    }

    .result-emoji {
      display: inline-block;
      margin-bottom: 12px;
      font-size: 64px;
      line-height: 1;
      animation: result-bounce 800ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .results h2 {
      margin: 0 0 8px;
      font-size: 30px;
      letter-spacing: -0.03em;
    }

    .result-score {
      margin: 0 0 7px;
      color: var(--purple-dark);
      font-size: 20px;
      font-weight: 850;
    }

    .result-message {
      margin: 0 auto 26px;
      color: var(--muted);
    }

    .restart {
      min-height: 48px;
      padding: 12px 24px;
      border: 0;
      border-radius: 14px;
      background: var(--purple);
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(112, 71, 235, 0.28);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .restart:hover {
      transform: translateY(-2px);
      box-shadow: 0 13px 28px rgba(112, 71, 235, 0.36);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(3px); }
    }

    @keyframes correct-pop {
      0% { transform: scale(1); }
      45% { transform: scale(1.035); }
      100% { transform: scale(1); }
    }

    @keyframes float-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateX(18px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes result-bounce {
      0% { opacity: 0; transform: scale(0.4) rotate(-12deg); }
      65% { transform: scale(1.15) rotate(4deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.14; transform: scale(0.8) rotate(0); }
      50% { opacity: 0.38; transform: scale(1.2) rotate(20deg); }
    }

    @keyframes status-pulse {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; box-shadow: 0 0 0 5px color-mix(in srgb, var(--green) 12%, transparent); }
    }

    @keyframes star-drift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(40px, 24px, 0); }
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 14px;
      }

      .topbar {
        padding: 21px 20px 15px;
      }

      .progress-track {
        margin-inline: 20px;
      }

      .content {
        padding: 25px 20px 22px;
      }

      .mission-status {
        padding-inline: 8px;
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="star-field" aria-hidden="true"></div>
  <main class="quiz-shell">
    <div class="brand" aria-label="Cosmic Quest mission control: systems online">
      <span class="brand-identity">
        <span class="brand-mark" aria-hidden="true">🚀</span>
        <span>Cosmic Quest</span>
      </span>
      <span class="mission-status">
        <span class="status-light" aria-hidden="true"></span>
        Systems online
      </span>
    </div>

    <section class="card" aria-label="Space exploration quiz">
      <div id="quiz-view">
        <div class="topbar">
          <span id="question-count">Question 1 of 10</span>
          <span class="score">Score <strong id="score">0</strong></span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="content">
          <div class="question-stage" id="question-stage">
            <p class="question-tag">Choose one answer</p>
            <h1 id="question"></h1>
            <div class="answers" id="answers"></div>
            <p class="feedback" id="feedback" aria-live="polite"></p>
          </div>
        </div>
      </div>

      <div class="results" id="results" aria-live="polite">
        <div class="result-emoji" id="result-emoji" aria-hidden="true"></div>
        <h2 id="result-title"></h2>
        <p class="result-score" id="result-score"></p>
        <p class="result-message" id="result-message"></p>
        <button class="restart" id="restart" type="button">Explore again</button>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      {
        question: "Which planet is known as the Red Planet?",
        answers: ["Venus", "Mars", "Jupiter", "Mercury"],
        correct: 1
      },
      {
        question: "Who was the first person to walk on the Moon?",
        answers: ["Yuri Gagarin", "Buzz Aldrin", "Neil Armstrong", "John Glenn"],
        correct: 2
      },
      {
        question: "What was the name of the first artificial satellite?",
        answers: ["Sputnik 1", "Explorer 1", "Vanguard 1", "Luna 2"],
        correct: 0
      },
      {
        question: "Which spacecraft has traveled farthest from Earth?",
        answers: ["New Horizons", "Voyager 1", "Pioneer 10", "Cassini"],
        correct: 1
      },
      {
        question: "What is the largest planet in our solar system?",
        answers: ["Saturn", "Neptune", "Earth", "Jupiter"],
        correct: 3
      },
      {
        question: "Which space telescope launched in December 2021?",
        answers: ["Hubble", "Kepler", "James Webb", "Spitzer"],
        correct: 2
      },
      {
        question: "What is the name of our galaxy?",
        answers: ["Andromeda", "Milky Way", "Whirlpool", "Sombrero"],
        correct: 1
      },
      {
        question: "Which planet did the Curiosity rover land on?",
        answers: ["Mars", "Venus", "Mercury", "Jupiter"],
        correct: 0
      },
      {
        question: "What was the first reusable spacecraft?",
        answers: ["Soyuz", "Apollo", "Space Shuttle", "Dragon"],
        correct: 2
      },
      {
        question: "Which celestial body has the strongest gravity in our solar system?",
        answers: ["Earth", "Jupiter", "The Sun", "Saturn"],
        correct: 2
      }
    ];

    const questionElement = document.querySelector("#question");
    const answersElement = document.querySelector("#answers");
    const feedbackElement = document.querySelector("#feedback");
    const scoreElement = document.querySelector("#score");
    const questionCountElement = document.querySelector("#question-count");
    const progressBarElement = document.querySelector("#progress-bar");
    const progressTrackElement = document.querySelector(".progress-track");
    const questionStageElement = document.querySelector("#question-stage");
    const quizViewElement = document.querySelector("#quiz-view");
    const resultsElement = document.querySelector("#results");
    const restartButton = document.querySelector("#restart");

    let currentQuestion = 0;
    let score = 0;
    let acceptingAnswer = true;

    function renderQuestion() {
      const item = questions[currentQuestion];
      acceptingAnswer = true;
      feedbackElement.textContent = "";
      feedbackElement.className = "feedback";
      questionElement.textContent = item.question;
      questionCountElement.textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
      scoreElement.textContent = score;

      const progress = ((currentQuestion + 1) / questions.length) * 100;
      progressBarElement.style.width = `${progress}%`;
      progressTrackElement.setAttribute("aria-valuenow", String(currentQuestion + 1));

      answersElement.replaceChildren();
      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.type = "button";
        button.textContent = answer;
        button.addEventListener("click", () => selectAnswer(index, button));
        answersElement.append(button);
      });

      questionStageElement.classList.remove("enter");
      requestAnimationFrame(() => questionStageElement.classList.add("enter"));
    }

    function selectAnswer(selectedIndex, selectedButton) {
      if (!acceptingAnswer) {
        return;
      }

      acceptingAnswer = false;
      const item = questions[currentQuestion];
      const buttons = Array.from(answersElement.querySelectorAll(".answer"));
      const isCorrect = selectedIndex === item.correct;

      buttons.forEach((button) => {
        button.disabled = true;
      });

      if (isCorrect) {
        score += 1;
        scoreElement.textContent = score;
        selectedButton.classList.add("correct");
        feedbackElement.textContent = "Correct! Stellar work ✨";
        feedbackElement.classList.add("correct");
      } else {
        selectedButton.classList.add("wrong");
        buttons[item.correct].classList.add("reveal");
        feedbackElement.textContent = `Not quite — ${item.answers[item.correct]} is correct.`;
        feedbackElement.classList.add("wrong");
      }

      window.setTimeout(advanceQuiz, 1250);
    }

    function advanceQuiz() {
      currentQuestion += 1;
      if (currentQuestion < questions.length) {
        renderQuestion();
        return;
      }

      showResults();
    }

    function showResults() {
      const percentage = score / questions.length;
      const reaction = percentage >= 0.8
        ? { emoji: "🏆", title: "Cosmic expert!", message: "Your space knowledge is truly out of this world." }
        : percentage >= 0.5
          ? { emoji: "🚀", title: "Great voyage!", message: "A strong mission — you are ready to explore even farther." }
          : { emoji: "🌙", title: "Keep exploring!", message: "Every great explorer starts by looking up." };

      quizViewElement.hidden = true;
      document.querySelector("#result-emoji").textContent = reaction.emoji;
      document.querySelector("#result-title").textContent = reaction.title;
      document.querySelector("#result-score").textContent = `${score} out of ${questions.length} correct`;
      document.querySelector("#result-message").textContent = reaction.message;
      resultsElement.classList.add("visible");
      restartButton.focus();
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      resultsElement.classList.remove("visible");
      quizViewElement.hidden = false;
      renderQuestion();
    }

    restartButton.addEventListener("click", restartQuiz);
    renderQuestion();
  </script>
</body>
</html>
